name: promote-production

on:
  push:
    branches:
      - main

jobs:

  promote:

    runs-on: ubuntu-latest

    environment:
      name: production

    strategy:
      matrix:
        service:
          - user-service
          - order-service
          - payment-service
          - product-service

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: Emmy-github-webdev/Kubernetes-argocd
          token: ${{ secrets.JA_MICS_AP_TOKEN }}
          path: Kubernetes-argocd

      - name: Read Current Staging Image Tag
        id: image
        run: |
          FILE="Kubernetes-argocd/apps/${{ matrix.service }}/overlays/staging/kustomization.yaml"

          TAG=$(awk '/newTag:/ {print $2; exit}' "$FILE")

          if [ -z "$TAG" ]; then
            echo "ERROR: Could not find newTag in $FILE"
            exit 1
          fi

          echo "Staging image tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Promotion Branch
        run: |
          BRANCH="promote-prod-${{ matrix.service }}-${{ github.sha }}"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          cd Kubernetes-argocd

          git checkout -b "$BRANCH"

      - name: Update Production Overlay
        run: |
          FILE="Kubernetes-argocd/apps/${{ matrix.service }}/overlays/prod/kustomization.yaml"

          echo "Updating $FILE"

          sed -i \
            "s/newTag:.*/newTag: ${{ steps.image.outputs.tag }}/" \
            "$FILE"

          echo "Updated production kustomization:"
          cat "$FILE"

      - name: Commit Changes
        run: |
          cd Kubernetes-argocd

          git config user.name "Emmy-github-webdev"
          git config user.email "${{ secrets.USER_EMAIL }}"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Promote ${{ matrix.service }} to production"

      - name: Push Branch
        run: |
          cd Kubernetes-argocd

          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.JA_MICS_AP_TOKEN }}
        run: |
          cd Kubernetes-argocd

          git fetch origin

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "Promote ${{ matrix.service }} to production" \
            --body "Promoting validated image tag ${{ steps.image.outputs.tag }} from staging to production."
