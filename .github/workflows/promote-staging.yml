name: promote-staging

on:
  push:
    branches:
      - staging

jobs:

  promote:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - order-service
          - payment-service
          - product-service

    permissions:
      contents: write
      pull-requests: write

    steps:

      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: Emmy-github-webdev/Kubernetes-argocd
          token: ${{ secrets.JA_MICS_AP_TOKEN }}
          path: Kubernetes-argocd

      - name: Read Current Dev Image Tag
        id: image
        run: |
          FILE="Kubernetes-argocd/apps/${{ matrix.service }}/overlays/dev/kustomization.yaml"

          TAG=$(awk '/newTag:/ {print $2; exit}' "$FILE")

          if [ -z "$TAG" ]; then
            echo "ERROR: Could not find newTag in $FILE"
            exit 1
          fi

          echo "Dev image tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create Promotion Branch
        run: |
          BRANCH="promote-staging-${{ matrix.service }}-${{ github.sha }}"

          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

          cd Kubernetes-argocd

          git checkout -b "$BRANCH"

      - name: Update Staging Overlay
        run: |
          FILE="Kubernetes-argocd/apps/${{ matrix.service }}/overlays/staging/kustomization.yaml"

          echo "Updating $FILE"

          sed -i \
            "s/newTag:.*/newTag: ${{ steps.image.outputs.tag }}/" \
            "$FILE"

          echo "Updated staging kustomization:"
          cat "$FILE"

      - name: Commit Changes
        run: |
          cd Kubernetes-argocd

          git config user.name "Emmy-github-webdev"
          git config user.email "${{ secrets.USER_EMAIL }}"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Promote ${{ matrix.service }} to staging"

      - name: Push Branch
        run: |
          cd Kubernetes-argocd

          git push origin "$BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.JA_MICS_AP_TOKEN }}
        run: |
          cd Kubernetes-argocd

          git fetch origin

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "Promote ${{ matrix.service }} to staging" \
            --body "Promoting image tag ${{ steps.image.outputs.tag }} from dev to staging."


  staging-validation:

    needs: promote

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Wait for ArgoCD Deployment
        run: |
          echo "Waiting for staging deployment..."
          sleep 180

      - name: Smoke Tests
        run: |
          ./tests/smoke/run.sh

      - name: API Tests
        run: |
          mvn test -Pstaging-api

      - name: Contract Tests
        run: |
          mvn verify -Pcontract

      - name: End-to-End Tests
        run: |
          npx playwright test

      - name: Performance Tests
        run: |
          k6 run performance/checkout.js

      - name: OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t https://api.staging.emmanuelogah.com
